# 로컬 개발 프로파일 (기본값). docker-compose 의 Postgres/Redis 를 씀.
spring:
  jpa:
    show-sql: true

app:
  auth:
    cookie:
      secure: false   # http localhost 라 Secure 쿠키 불가

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: debug

management:
  endpoint:
    health:
      show-details: always
