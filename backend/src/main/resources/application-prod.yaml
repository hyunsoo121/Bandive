# 운영 프로파일. 모든 접속 정보는 환경변수 필수 (미설정 시 기동 실패).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    show-sql: false

# 로컬은 다른 프로젝트와의 포트 충돌 회피용 8081 — 운영 호스트엔 그런 충돌이 없으니 표준 포트로 복구
server:
  port: ${SERVER_PORT:8080}
  # Caddy 리버스 프록시 뒤에서 X-Forwarded-Proto 등을 신뢰 — 안 하면 OAuth2 redirect-uri({baseUrl}/...) 가
  # 실제 요청 스킴(https)이 아니라 Caddy→backend 내부 통신 스킴(http)으로 만들어져 카카오가 리다이렉트 URI
  # 불일치로 거부한다.
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never
