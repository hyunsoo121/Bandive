spring:
  application:
    name: bandive
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bandive}
    username: ${DB_USERNAME:bandive}
    password: ${DB_PASSWORD:bandive}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8081}   # 8080 은 다른 프로젝트가 점유 중일 수 있어 기본값 8081
  error:
    include-message: always
    include-stacktrace: never   # 전역 예외 핸들러는 Phase 3

app:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      access-ttl: PT30M
      refresh-ttl: P14D
    oauth2:
      success-redirect: ${APP_OAUTH2_SUCCESS_REDIRECT:http://localhost:5173/oauth/success}
      failure-redirect: ${APP_OAUTH2_FAILURE_REDIRECT:http://localhost:5173/oauth/failure}
    cookie:
      secure: true
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:./uploads}
    public-base-url: ${APP_STORAGE_PUBLIC_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
