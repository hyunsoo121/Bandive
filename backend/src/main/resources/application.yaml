spring:
  application:
    name: bandive
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bandive}
    username: ${DB_USERNAME:bandive}
    password: ${DB_PASSWORD:bandive}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

server:
  port: ${SERVER_PORT:8081}   # 8080 은 다른 프로젝트가 점유 중일 수 있어 기본값 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
