name: Deploy

# main 에 머지되면(승격) 이미지 빌드 → ECR push → EC2(SSM)에서 pull & 재기동.
# 필요한 저장소 secrets 는 docs/DEPLOY.md 참고.
on:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC 로 AWS 자격 얻기 (장기 액세스 키 없음)
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPO: bandive-backend
  ECR_FRONTEND_REPO: bandive-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # 세션 태그를 아예 안 보내서 신뢰 정책에 sts:TagSession 없어도 되게 함
          role-skip-session-tagging: true

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # EC2 에 SSH 로 들어가지 않고 SSM RunCommand 로 배포 (포트 22 안 열어도 됨).
      # 서버의 /opt/bandive 에는 docker-compose.prod.yml + .env 가 이미 있다고 가정.
      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          PARAMS=$(jq -n --arg reg "$REGISTRY" --arg region "$AWS_REGION" '{
            commands: [
              "set -e",
              "cd /opt/bandive",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $reg),
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d --remove-orphans",
              "docker image prune -f"
            ]
          }')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "bandive deploy ${{ github.sha }}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)

          echo "SSM command id: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "배포 실패 (SSM 명령 상태: $STATUS)"
            exit 1
          fi
